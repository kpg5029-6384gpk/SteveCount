plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'stevecount-fabric' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../minecraft-mod/src/main/resources')
sourceSets.test.java.srcDir('../minecraft-mod/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
loom {
    runs {
        client {
            if (project.hasProperty('stevecountSmoke')) vmArg '-Dstevecount.smoke=true'
            if (project.hasProperty('stevecountCostumeSmoke')) {vmArg '-Dstevecount.followerSmoke=true';vmArg '-Dstevecount.costumeSmoke=true'}
            if (project.hasProperty('stevecountWanderSmoke')) {vmArg '-Dstevecount.followerSmoke=true';vmArg '-Dstevecount.wanderSmoke=true'}
            if (project.hasProperty('stevecountFollowerSmoke')) vmArg '-Dstevecount.followerSmoke=true'
            if (project.hasProperty('stevecountPunchSmoke')) {vmArg '-Dstevecount.followerSmoke=true';vmArg '-Dstevecount.punchSmoke=true'}
            if (project.hasProperty('stevecountPlayerEmotesSmoke')) {vmArg '-Dstevecount.followerSmoke=true';vmArg '-Dstevecount.punchSmoke=true';vmArg '-Dstevecount.playerEmotesSmoke=true'}
        }
    }
}
processResources {
    def modVersion=project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
tasks.register('coreChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.stevecount.CoreChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'coreChecks' }
jar { from('../LICENSE') }
