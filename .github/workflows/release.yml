name: Build and publish SteveCount wandering and timed outfit
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stevecount-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -r companion/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Build and test NeoForge 26.3 mod
        run: |
          & .\minecraft-mod\gradlew.bat -p minecraft-mod build --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Minecraft checks failed' }
      - name: Build and test Fabric 26.3 mod
        run: |
          & .\fabric-mod\gradlew.bat -p fabric-mod build --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Fabric checks failed' }
      - name: Test companion
        run: |
          & .\.venv\Scripts\python.exe -m pytest companion/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Companion checks failed' }
      - name: Build standalone Windows companion
        run: .\companion\build-windows.ps1
      - name: Test packaged offline speech recognition
        run: |
          Copy-Item companion/tests/fixtures/head-on.wav voice-fixture.wav
          $proc = Start-Process -FilePath dist/SteveCount-Companion.exe -ArgumentList '--voice-self-test voice-fixture.wav voice-result.json' -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit(60000)) { $proc.Kill(); throw 'Voice self test timed out' }
          if ($proc.ExitCode -ne 0) { throw 'Packaged voice self test failed' }
          $result = Get-Content voice-result.json -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.command -ne 'head_on') { throw 'Speech was not recognized' }
      - name: Smoke test packaged EXE and authenticated localhost
        run: |
          @'
          import json, os, pathlib, subprocess, time, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stevecount-exe-smoke'
          root.mkdir(exist_ok=True)
          env=os.environ.copy()
          env['LOCALAPPDATA']=str(root)
          proc=subprocess.Popen([str(pathlib.Path('dist/SteveCount-Companion.exe').resolve())],env=env)
          try:
              deadline=time.monotonic()+45
              while time.monotonic()<deadline:
                  if proc.poll() is not None:
                      raise RuntimeError('Packaged companion exited unexpectedly')
                  try:
                      token=json.loads((root/'SteveCount/connection.json').read_text())['token']
                      req=urllib.request.Request('http://127.0.0.1:18763/status',headers={'Authorization':'Bearer '+token})
                      with urllib.request.urlopen(req,timeout=2) as response:
                          data=json.load(response)
                      assert data['status']=='Not Configured' and data['viewers'] is None
                      print('Packaged EXE startup and authenticated HTTP status passed')
                      break
                  except (OSError, ValueError, KeyError):
                      time.sleep(1)
              else:
                  err=root/'SteveCount/startup-error.log'
                  if err.exists(): print(err.read_text())
                  raise RuntimeError('No authenticated status from packaged companion within 45 seconds')
          finally:
              proc.terminate()
              try: proc.wait(timeout=10)
              except subprocess.TimeoutExpired: proc.kill()
          '@ | .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Packaged companion smoke test failed' }
      - name: Package verified release
        run: |
          Add-Content TEST-REPORT.md "`n## GitHub-hosted Windows verification`nThis build passed the packaged EXE startup and authenticated localhost status smoke test on a GitHub-hosted Windows runner. This supersedes the local machine execution blocker for this newly rebuilt artifact. Live TikTok streaming/paid gifts remain unverified; local disposable-world punch checks are described above.`n"
          & .\.venv\Scripts\python.exe scripts/package.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          @'
          import pathlib,zipfile
          for loader in ('Fabric','NeoForge'):
              p=pathlib.Path(f'dist/SteveCount-Windows-{loader}.zip')
              assert p.is_file()
              z=zipfile.ZipFile(p)
              assert z.testzip() is None
              assert {'SteveCount-Companion.exe',f'SteveCount-26.3-{loader}.jar','INSTALL.md'}.issubset(z.namelist())
              assert [n for n in z.namelist() if n.endswith('.jar')]==[f'SteveCount-26.3-{loader}.jar']
              print('Verified Windows installation ZIP',p.name,p.stat().st_size)
          '@ | .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SteveCount-Windows
          path: dist/
      - name: Publish release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          @'
          SteveCount wandering + timed maid outfit, Minecraft 26.3, Fabric and NeoForge.

          Fabric users: download SteveCount-Windows-Fabric.zip. Close Minecraft and the old companion, then replace BOTH the matching SteveCount JAR and SteveCount-Companion.exe. Keep only one SteveCount JAR in your instance mods folder. NeoForge users should choose SteveCount-Windows-NeoForge.zip instead.

          Little Buddy wanders close and far within the configured radius, rests between strolls, and sometimes runs ahead, beside or behind you while moving. J > Buddy options > Wandering toggles classic follow mode. K > Character > Roam radius adjusts the radius. Head riding and manual emotes take priority.

          Each individual TikTok gift priced 1,000 coins or more changes ONLY the local player's outfit to the approved maid costume for 30 real minutes. Another qualifying gift RESTARTS thirty minutes; time does not stack and cheaper gifts do not accumulate. The deadline persists across restarts and the original outfit returns automatically. Armor is hidden visually while keeping its real equipment/protection. Little Buddy and other players are unchanged. J > Buddy options > Gift outfit provides preview, restore and disable controls. Real gift triggers require Streamer mode, Live status and demo off. The original user-supplied PNG is bundled, credited to 8onfire: https://www.planetminecraft.com/skin/maid-outfit-skin-overlay/ . See GIFT-OUTFIT.md and COSTUME-NOTICE.md.

          Keeps the previous head attachment fix, voice controls, Player Emotes adapter and Hand Heart punch behavior. Player Emotes 2.0.3 for Minecraft 26.3 is optional and installed separately for the same loader: https://modrinth.com/mod/player-emotes . Fabric requires Loader 0.20.1+ and Fabric API 0.166.2+26.3. NeoForge uses 26.3.0.102.

          Local verification: both loader builds, 12,260 Java core checks per loader and 87 Python tests passed. Disposable Minecraft worlds verified wandering, radius/clearance, catch-up, pause, head ride, player-only costume, wide/slim models, first-person arms, Survival inventory/armor retention, expiry and disabling. Gift events were synthetic; no new paid TikTok gift or Fiishy's microphone test is claimed. The release runner also verifies packaged recognition, authenticated localhost and installation ZIP integrity. Unsigned release candidate. See TEST-REPORT.md.
          '@ | Set-Content release-notes.md
          $tag = 'v1.0.0-rc.12-build-' + $env:GITHUB_RUN_NUMBER
          gh release create $tag dist/SteveCount-Windows-Fabric.zip dist/SteveCount-Windows-NeoForge.zip dist/SteveCount-26.3-Fabric.jar dist/SteveCount-Windows.zip dist/SteveCount-26.3-NeoForge.jar dist/SteveCount-Companion.exe dist/SteveCount-Source.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "SteveCount — Wandering + timed maid outfit" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

